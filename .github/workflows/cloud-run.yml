name: Deploy to Cloud Run

on:
  push:
    branches:
      - main  # 當程式碼推送到 main 分支時觸發

# 加入 Workload Identity Federation 必須的權限設定
permissions:
  contents: 'read'
  id-token: 'write' # 這是必要權限！

env:
  PROJECT_ID: tibametopics            # 你的 GCP 專案 ID
  GAR_LOCATION: asia-east1             # Artifact Registry 的區域（台灣為 asia-east1）
  SERVICE: tibame       # Cloud Run 的服務名稱
  REGION: asia-east1                   # Cloud Run 部署的區域

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # 1. 登入 GCP 驗證 (使用 Workload Identity Federation)
    - name: Google Auth via Workload Identity Federation
      uses: google-github-actions/auth@v2
      with:
        # 這裡引用您剛剛在 GitHub 設定的變數/秘密
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    # 2. 設定 GCP CLI 工具
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    # 3. 登入 GCP 的 Docker 倉庫 (Artifact Registry)
    - name: Configure Docker
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    # 4. 建立 Docker 映像檔並加上標籤
    - name: Build and Push Container
      run: |
        IMAGE_NAME=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/my-repo/${{ env.SERVICE }}:${{ github.sha }}
        docker build -t $IMAGE_NAME .
        docker push $IMAGE_NAME
        echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

    # 5. 正式部署到 Cloud Run
    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v1
      with:
        service: ${{ env.SERVICE }}
        region: ${{ env.REGION }}
        image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/my-repo/${{ env.SERVICE }}:${{ github.sha }}
        # 允許外部公開存取（若為內部 API 或純排程可設為 internal）
        flags: '--allow-unauthenticated'
